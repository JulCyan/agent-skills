name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      AGENT_SKILLS_FORBIDDEN_TOKENS: ${{ secrets.AGENT_SKILLS_FORBIDDEN_TOKENS }}
      OWNER_CONTEXT: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out the reviewed ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 22.20.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: skills/shopify-media-sync/scripts/media-sync-go/go.mod
          cache-dependency-path: skills/shopify-media-sync/scripts/media-sync-go/go.mod

      - name: Require the private publication denylist in owner context
        shell: bash
        run: |
          if [[ "$OWNER_CONTEXT" == "true" && -z "$AGENT_SKILLS_FORBIDDEN_TOKENS" ]]; then
            echo "AGENT_SKILLS_FORBIDDEN_TOKENS is required for owner-controlled validation" >&2
            exit 1
          fi

      - name: Run full acceptance
        run: npm test
